<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

<!-- Feather -->
<symbol id="icon-feather" viewBox="0 0 64 64" fill="none">
  <path d="M8 56C8 56 12 40 24 28C36 16 56 8 56 8C56 8 52 24 40 36C28 48 8 56 8 56Z" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <path d="M8 56C8 56 20 36 32 24C44 12 56 8 56 8" fill="none" stroke="currentColor" stroke-width="0.8" opacity="0.4"/>
  <path d="M20 40C20 40 28 28 36 20" fill="none" stroke="currentColor" stroke-width="0.8" opacity="0.3"/>
  <path d="M14 48C14 48 22 36 30 28" fill="none" stroke="currentColor" stroke-width="0.8" opacity="0.3"/>
</symbol>

<!-- Bird -->
<symbol id="icon-bird" viewBox="0 0 48 32" fill="none">
  <path d="M4 28C8 20 16 12 24 8C32 4 40 4 44 8" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <path d="M24 8C20 12 16 16 14 20" stroke="currentColor" stroke-width="1" fill="none" opacity="0.6"/>
  <path d="M44 8L40 12M44 8L42 14" stroke="currentColor" stroke-width="1" fill="none"/>
</symbol>

<!-- Gold arc -->
<symbol id="icon-arc" viewBox="0 0 120 60" fill="none">
  <path d="M10 50C10 50 30 10 60 10C90 10 110 50 110 50" stroke="currentColor" stroke-width="1.5" fill="none"/>
</symbol>

<!-- Calendar -->
<symbol id="icon-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
  <rect x="3" y="4" width="18" height="18" rx="2"/>
  <line x1="16" y1="2" x2="16" y2="6"/>
  <line x1="8" y1="2" x2="8" y2="6"/>
  <line x1="3" y1="10" x2="21" y2="10"/>
</symbol>

<!-- Location pin -->
<symbol id="icon-location" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
  <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
  <circle cx="12" cy="9" r="2.5"/>
</symbol>

<!-- Clock -->
<symbol id="icon-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
  <circle cx="12" cy="12" r="10"/>
  <polyline points="12 6 12 12 16 14"/>
</symbol>

<!-- Ticket -->
<symbol id="icon-ticket" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
  <path d="M2 9a3 3 0 000 6v3a1 1 0 001 1h18a1 1 0 001-1v-3a3 3 0 000-6V6a1 1 0 00-1-1H3a1 1 0 00-1 1v3z"/>
  <line x1="9" y1="4" x2="9" y2="20" stroke-dasharray="2 2"/>
</symbol>

<!-- Phone -->
<symbol id="icon-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
  <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/>
</symbol>

<!-- Mail -->
<symbol id="icon-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
  <rect x="2" y="4" width="20" height="16" rx="2"/>
  <polyline points="22,6 12,13 2,6"/>
</symbol>

<!-- Arrow right -->
<symbol id="icon-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
  <line x1="5" y1="12" x2="19" y2="12"/>
  <polyline points="12 5 19 12 12 19"/>
</symbol>

<!-- Chevron -->
<symbol id="icon-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
  <polyline points="6 9 12 15 18 9"/>
</symbol>

<!-- Check -->
<symbol id="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
  <polyline points="20 6 9 17 4 12"/>
</symbol>

</svg>
